apiVersion: batch/v1
kind: Job
metadata:
  name: job-para-test
  namespace: pod-controller
spec:
  parallelism: 2
  completions: 8
  template:
    spec:
      containers:
      - name: test-job
        image: shixiaochuangk8s/busybox:1.28.3
        command: ["echo", "test paralle job!"]
      restartPolicy: Never