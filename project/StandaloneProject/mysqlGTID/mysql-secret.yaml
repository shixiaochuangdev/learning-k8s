apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: mysql-cluster
type: Opaque
stringData:
  # MySQL root 密码
  MYSQL_ROOT_PASSWORD: "root"

  # 主从复制用户
  MYSQL_REPLICATION_USER: "replicate"

  # 主从复制用户密码
  MYSQL_REPLICATION_PASSWORD: "replicate"

  # Java 项目数据库名称
  MYSQL_DATABASE: "sky_take_out"

  # Java 项目数据库用户
  MYSQL_USER: "sky_take_out"

  # Java 项目数据库用户密码
  MYSQL_PASSWORD: "sky_take_out"