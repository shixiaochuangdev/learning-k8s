apiVersion: apps/v1
kind: Deployment

metadata:
  name: sky-server
  namespace: javaproject

spec:

  #################################
  # 副本数量
  #################################

  replicas: 2


  #################################
  # 滚动更新策略
  #################################

  strategy:
    type: RollingUpdate

    rollingUpdate:

      # 更新过程中至少保持原有 Pod 可用
      maxUnavailable: 0

      # 最多额外创建 1 个 Pod
      maxSurge: 1


  #################################
  # Pod 选择器
  #################################

  selector:
    matchLabels:
      app: sky-server


  #################################
  # Pod 模板
  #################################

  template:

    metadata:
      labels:
        app: sky-server

    spec:

      #################################
      # Harbor 私有仓库认证
      #################################

      serviceAccountName: harbor-sa


      #################################
      # 优雅终止时间
      #################################

      terminationGracePeriodSeconds: 30


      containers:

        - name: sky-server

          #################################
          # 项目镜像
          #################################

          image: harbor.shixiaochuang.org/project/sky-server:v1.0

          imagePullPolicy: IfNotPresent


          #################################
          # 容器端口
          #################################

          ports:

            - name: http
              containerPort: 8080
              protocol: TCP


          #################################
          # 单独环境变量
          #################################

          env:

            # 设置容器时区
            - name: TZ
              value: "Asia/Shanghai"


          #################################
          # ConfigMap + Secret
          #################################

          envFrom:

            # 普通配置
            - configMapRef:
                name: sky-server-config

            # 敏感配置
            - secretRef:
                name: sky-server-secret


          #################################
          # 资源配置
          #################################

          resources:

            requests:
              cpu: "200m"
              memory: "512Mi"

            limits:
              cpu: "500m"
              memory: "1Gi"


          #################################
          # 启动探针
          #################################

          startupProbe:

            tcpSocket:
              port: 8080

            # 每 5 秒检查一次
            periodSeconds: 5

            # 最多允许失败 30 次
            # 即最长给 Spring Boot 150 秒启动时间
            failureThreshold: 30

            timeoutSeconds: 3


          #################################
          # 就绪探针
          #################################

          readinessProbe:

            tcpSocket:
              port: 8080

            periodSeconds: 5

            failureThreshold: 3

            timeoutSeconds: 3


          #################################
          # 存活探针
          #################################

          livenessProbe:

            tcpSocket:
              port: 8080

            periodSeconds: 10

            failureThreshold: 3

            timeoutSeconds: 3

---
apiVersion: v1
kind: Service

metadata:
  name: sky-server
  namespace: javaproject

spec:

  type: ClusterIP

  selector:
    app: sky-server

  ports:

    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP