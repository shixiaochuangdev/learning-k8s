apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: redis-cluster
  labels:
    app: redis-cluster
spec:
  # Headless Service
  clusterIP: None

  # 即使 Pod 尚未 Ready，也发布 Pod DNS
  # Redis Cluster 节点发现时非常重要
  publishNotReadyAddresses: true

  selector:
    app: redis-cluster

  ports:
    # Redis 客户端通信端口
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP

    # Redis Cluster Bus 通信端口
    - name: cluster-bus
      port: 16379
      targetPort: 16379
      protocol: TCP