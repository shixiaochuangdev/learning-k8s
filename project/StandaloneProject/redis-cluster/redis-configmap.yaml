apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-config
  namespace: redis-cluster
data:
  redis.conf: |
    #################################
    # Redis 基础配置
    #################################

    # 监听所有 IPv4 地址
    # Kubernetes Pod 之间需要通过 Pod 网络通信，
    # 不能继续使用默认的 127.0.0.1
    bind 0.0.0.0

    # 开启保护模式
    # Redis 密码后续由 Secret 注入
    protected-mode yes

    # Redis 服务端口
    port 6379

    # TCP 连接队列
    tcp-backlog 511

    # 客户端空闲连接不主动断开
    timeout 0

    # TCP Keepalive
    tcp-keepalive 300


    #################################
    # Redis 运行配置
    #################################

    # Redis 在容器中以前台方式运行
    daemonize no

    # 日志级别
    loglevel notice

    # 日志输出到标准输出
    # 方便通过 kubectl logs 查看
    logfile ""

    # Redis Cluster 只支持 DB 0
    databases 1


    #################################
    # Redis 持久化配置
    #################################

    # Redis 数据目录
    # 后续 StatefulSet 会把 PVC 挂载到 /data
    dir /data

    # RDB 文件名称
    dbfilename dump.rdb

    # 开启 RDB 快照
    save 3600 1 300 100 60 10000

    # RDB 快照失败时停止接收写操作
    stop-writes-on-bgsave-error yes

    # 开启 RDB 压缩
    rdbcompression yes

    # 开启 RDB 校验
    rdbchecksum yes


    #################################
    # AOF 持久化配置
    #################################

    # 开启 AOF
    appendonly yes

    # AOF 文件名称
    appendfilename "appendonly.aof"

    # Redis 7.x AOF 文件目录
    appenddirname "appendonlydir"

    # 每秒执行一次 fsync
    appendfsync everysec

    # AOF 重写期间仍执行 fsync
    no-appendfsync-on-rewrite no

    # AOF 自动重写
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb

    # AOF 文件尾部不完整时尽可能恢复
    aof-load-truncated yes

    # 使用 RDB 作为 AOF Base 文件
    aof-use-rdb-preamble yes


    #################################
    # Redis Cluster 配置
    #################################

    # 开启 Redis Cluster 模式
    cluster-enabled yes

    # Redis Cluster 节点配置文件
    # 注意：该文件由 Redis 自动生成和维护
    # 必须放入可写的持久化目录
    cluster-config-file /data/nodes.conf

    # 节点失联 5 秒后进入故障判断
    cluster-node-timeout 5000

    # Cluster Bus 默认端口：
    # Redis 端口 + 10000
    # 即 6379 + 10000 = 16379
    cluster-port 0

    # 要求 16384 个 Slot 全部有节点负责
    cluster-require-full-coverage yes

    # Replica 可以自动参与 Master 故障转移
    cluster-replica-no-failover no

    # 集群异常时不继续提供不完整的数据访问
    cluster-allow-reads-when-down no


    #################################
    # 主从复制配置
    #################################

    # Replica 仍可以提供读服务
    replica-serve-stale-data yes

    # Replica 默认只读
    replica-read-only yes

    # 使用无盘复制
    repl-diskless-sync yes

    # 无盘同步等待时间
    repl-diskless-sync-delay 5

    # Replica 优先级
    replica-priority 100


    #################################
    # 内存与后台任务配置
    #################################

    # 使用动态 hz
    dynamic-hz yes

    # 后台 Jemalloc 线程
    jemalloc-bg-thread yes