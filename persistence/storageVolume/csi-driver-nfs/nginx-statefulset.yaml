apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: volume-ns
spec:

  clusterIP: None

  selector:
    app: nginx

  ports:
    - name: web
      port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  namespace: volume-ns

spec:
  serviceName: nginx

  replicas: 2

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: shixiaochuangk8s/nginx:1.17.2

          ports:
            - containerPort: 80
              name: web

          volumeMounts:
            - name: www
              mountPath: /usr/share/nginx/html

  volumeClaimTemplates:

    - metadata:
        name: www

      spec:

        storageClassName: nfs-csi

        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi