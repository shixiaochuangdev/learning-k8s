apiVersion: v1
kind: Pod
metadata:
  name: pod-nfs-dynamic
  namespace: volume-ns
spec:

  containers:
    - name: nginx
      image: shixiaochuangk8s/nginx:1.17.1

      ports:
        - containerPort: 80

      volumeMounts:
        - name: nfs-data
          mountPath: /usr/share/nginx/html

  volumes:
    - name: nfs-data
      persistentVolumeClaim:
        claimName: pvc-nfs-dynamic