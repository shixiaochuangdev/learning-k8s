apiVersion: v1
kind: Pod
metadata:
  name: pod-pvc-nfs
  namespace: volume-ns
spec:
  containers:
    - name: nginx
      image: shixiaochuangk8s/nginx:1.17.1
      ports:
        - containerPort: 80

      volumeMounts:
        # 将 web-data 挂载到 Nginx 网站目录
        - name: web-data
          mountPath: /usr/share/nginx/html

  volumes:
    - name: web-data

      # Pod 不再直接配置 NFS
      # 这里只需要引用 PVC
      persistentVolumeClaim:
        claimName: pvc-nfs