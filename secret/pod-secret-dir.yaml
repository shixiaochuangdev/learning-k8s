apiVersion: v1
kind: Pod
metadata:
  name: pod-secret-dir
  namespace: secret-ns
spec:
  containers:
    - name: busybox
      image: shixiaochuangk8s/busybox:1.30
      args:
        - /bin/sh
        - -c
        - sleep 100000

      volumeMounts:

        # 方式一：目录形式挂载整个 Secret
        - name: vol-secret
          mountPath: /opt/passwd
          readOnly: true

  volumes:
    - name: vol-secret
      secret:
        secretName: secret-subpath