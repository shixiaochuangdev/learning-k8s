apiVersion: v1
kind: Pod
metadata:
  name: pod-secret-subpath
  namespace: secret-ns
spec:
  containers:
    - name: busybox
      image: shixiaochuangk8s/busybox:1.30
      args:
        - /bin/sh
        - -c
        - sleep 100000

      volumeMounts:
        - name: vol-secret

          # 容器中最终生成的文件路径
          mountPath: /opt/passwd/redis-password

          # 只选择 Secret 中 password 这个 key
          subPath: password

          readOnly: true

  volumes:
    - name: vol-secret
      secret:
        secretName: secret-subpath