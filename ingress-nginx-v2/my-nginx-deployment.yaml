apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nginx
  namespace: ingress-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-nginx
  template:
    metadata:
      labels:
        app: my-nginx
    spec:
      containers:
        - name: nginx
          image: shixiaochuangk8s/nginx:1.18
          ports:
            - containerPort: 80