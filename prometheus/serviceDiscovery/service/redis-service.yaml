apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis-ns

  labels:
    app: redis

  annotations:
    # 允许 Prometheus 采集
    prometheus.io/scrape: "true"

    # Exporter 指标端口
    prometheus.io/port: "9121"

    # 指标接口路径
    prometheus.io/path: "/metrics"

    # 指标采集协议
    prometheus.io/scheme: "http"

spec:
  type: ClusterIP

  selector:
    app: redis

  ports:
    # Redis 业务端口
    - name: redis
      port: 6379
      targetPort: redis

    # Redis Exporter 端口
    - name: metrics
      port: 9121
      targetPort: metrics