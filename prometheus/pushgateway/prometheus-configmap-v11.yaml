
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: prometheus-ns

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

    scrape_configs:
      # ==========================================
      # 1. Prometheus 自身监控
      # ==========================================
      - job_name: "prometheus"

        static_configs:
          - targets:
              - "localhost:9090"
            labels:
              app: "prometheus"

      # ==========================================
      # 2. CoreDNS 监控
      # ==========================================
      - job_name: "coredns"

        static_configs:
          - targets:
              - "10.244.222.69:9153"
              - "10.244.222.68:9153"

      # ==========================================
      # 3. Redis Exporter
      # ==========================================
      - job_name: "redis"

        static_configs:
          - targets:
              - "redis.redis-ns.svc.cluster.local:9121"

      # ==========================================
      # 4. Nginx Prometheus Exporter
      # ==========================================
      - job_name: "nginx"

        static_configs:
          - targets:
              - "nginx.nginx-ns.svc.cluster.local:9113"

      # ==========================================
      # 5. MySQL Exporter
      # ==========================================
      - job_name: "mysql"

        static_configs:
          - targets:
              - "mysql.mysql-monitor-ns.svc.cluster.local:9104"

      # ==========================================
      # 6. Kubernetes Node Exporter 监控
      # ==========================================
      - job_name: "node-exporter"

        # 通过 Kubernetes API 自动发现 Node
        kubernetes_sd_configs:
          - role: node

        relabel_configs:
          # 1. 将 Node InternalIP 改写为采集地址
          - source_labels:
              - __meta_kubernetes_node_address_InternalIP
            action: replace
            regex: (.+)
            target_label: __address__
            replacement: '${1}:9100'

          # 2. 添加 Node 名称标签
          - source_labels:
              - __meta_kubernetes_node_name
            target_label: node

      # ==========================================
      # 7. Kubernetes cAdvisor 容器监控
      # ==========================================
      - job_name: "cadvisor"

        # Kubelet 安全接口
        scheme: https
        metrics_path: /metrics/cadvisor

        # 自动发现 Kubernetes Node
        kubernetes_sd_configs:
          - role: node

        # 使用 ServiceAccount Token 认证
        authorization:
          type: Bearer
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token

        # 仅用于课堂实验
        tls_config:
          insecure_skip_verify: true

        relabel_configs:
          # 添加 Node 名称标签
          - source_labels:
              - __meta_kubernetes_node_name
            target_label: node

      # ==========================================
      # 8. Kubernetes Kubelet 监控
      # ==========================================
      - job_name: "kubelet"

        # 自动发现 Kubernetes Node
        kubernetes_sd_configs:
          - role: node

        # Kubelet 安全接口
        scheme: https
        metrics_path: /metrics

        # 使用 ServiceAccount Token 认证
        authorization:
          type: Bearer
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token

        # 仅用于课堂实验
        tls_config:
          insecure_skip_verify: true

        relabel_configs:
          # 1. 添加 Node 名称标签
          - source_labels:
              - __meta_kubernetes_node_name
            target_label: node

          # 2. 保留 Node 标签
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # ==========================================
      # 9. Kubernetes API Server 监控
      # ==========================================
      - job_name: "apiservers"

        # 通过 EndpointSlice 自动发现 API Server
        kubernetes_sd_configs:
          - role: endpointslice

        scheme: https
        metrics_path: /metrics

        # 使用 Kubernetes CA 证书
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

        # 使用 ServiceAccount Token 认证
        authorization:
          type: Bearer
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token

        relabel_configs:
          # 只保留 default 命名空间中的 kubernetes Service
          # 并要求 EndpointSlice 端口名称为 https
          - source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_service_name
              - __meta_kubernetes_endpointslice_port_name
            action: keep
            regex: 'default;kubernetes;https'

      # ==========================================
      # 10. Kubernetes Service 自动发现
      # ==========================================
      - job_name: "kubernetes-services"

        # 通过 EndpointSlice 自动发现 Service
        kubernetes_sd_configs:
          - role: endpointslice

        relabel_configs:
          # 1. 只保留允许 Prometheus 采集的 Service
          - source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_scrape
            action: keep
            regex: "true"

          # 2. 只保留 Metrics 端口
          - source_labels:
              - __meta_kubernetes_endpointslice_port_name
            action: keep
            regex: "metrics"

          # 3. 从 Service 注解获取采集协议
          - source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_scheme
            action: replace
            regex: (https?)
            target_label: __scheme__

          # 4. 从 Service 注解获取指标路径
          - source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_path
            action: replace
            regex: (.+)
            target_label: __metrics_path__

          # 5. 将 Service 注解端口保存到临时标签
          - source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_port
            action: replace
            regex: '([0-9]+)'
            replacement: '$1'
            target_label: __tmp_metrics_port

          # 6. 校验 EndpointSlice 端口与注解端口是否一致
          - source_labels:
              - __meta_kubernetes_endpointslice_port
            action: keepequal
            target_label: __tmp_metrics_port

          # 7. 将 Service Label 映射为普通标签
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)

          # 8. 添加 Namespace 标签
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: kubernetes_namespace

          # 9. 添加 Service 名称标签
          - source_labels:
              - __meta_kubernetes_service_name
            target_label: kubernetes_service

          # 10. 添加 Pod 名称标签
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: kubernetes_pod_name

      # ==========================================
      # 11. Kubernetes Pod 自动发现
      # ==========================================
      - job_name: "kubernetes-pods"

        # 通过 Kubernetes API 自动发现 Pod
        kubernetes_sd_configs:
          - role: pod

        relabel_configs:
          # 1. 只保留允许 Prometheus 采集的 Pod
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            action: keep
            regex: "true"

          # 2. 只采集容器声明的 Metrics 端口
          - source_labels:
              - __meta_kubernetes_pod_container_port_name
            action: keep
            regex: "metrics"

          # 3. 只保留 Running 状态的 Pod
          - source_labels:
              - __meta_kubernetes_pod_phase
            action: keep
            regex: "Running"

          # 4. 根据 Pod IP 和注解端口生成采集地址
          - source_labels:
              - __meta_kubernetes_pod_ip
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            action: replace
            regex: '(.+);([0-9]+)'
            replacement: '$1:$2'
            target_label: __address__

          # 5. 根据 Pod 注解设置 Metrics 路径
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            action: replace
            regex: (.+)
            target_label: __metrics_path__

          # 6. 根据 Pod 注解设置采集协议
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scheme
            action: replace
            regex: (https?)
            target_label: __scheme__

          # 7. 添加 Namespace 标签
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: kubernetes_namespace

          # 8. 添加 Pod 名称标签
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: kubernetes_pod_name

          # 9. 添加容器名称标签
          - source_labels:
              - __meta_kubernetes_pod_container_name
            target_label: kubernetes_container_name

          # 10. 添加 Node 名称标签
          - source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: kubernetes_node

      # ==========================================
      # 12. Kubernetes 资源对象状态监控
      # ==========================================
      - job_name: "kube-state-metrics"

        # 本任务每 30 秒采集一次
        scrape_interval: 30s

        # KSM 指标路径
        metrics_path: /metrics

        # 使用 Kubernetes EndpointSlice 服务发现
        kubernetes_sd_configs:
          - role: endpointslice

            # 只发现 ksm-ns 命名空间
            namespaces:
              names:
                - ksm-ns

        relabel_configs:
          # 1. 只保留 KSM 对应的 Service
          - source_labels:
              - __meta_kubernetes_service_name
            action: keep
            regex: "kube-state-metrics"

          # 2. 只保留 http-metrics 端口
          - source_labels:
              - __meta_kubernetes_endpointslice_port_name
            action: keep
            regex: "http-metrics"

          # 3. 添加 KSM 所属命名空间
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: ksm_namespace

          # 4. 添加 KSM Pod 名称
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: ksm_pod

      # ==========================================
      # 13. kube-state-metrics 自身运行监控
      # ==========================================
      - job_name: "kube-state-metrics-self"

        # 本任务每 30 秒采集一次
        scrape_interval: 30s

        # KSM 自身指标路径
        metrics_path: /metrics

        # 使用 Kubernetes EndpointSlice 服务发现
        kubernetes_sd_configs:
          - role: endpointslice

            # 只发现 ksm-ns 命名空间
            namespaces:
              names:
                - ksm-ns

        relabel_configs:
          # 1. 只保留 KSM 对应的 Service
          - source_labels:
              - __meta_kubernetes_service_name
            action: keep
            regex: "kube-state-metrics"

          # 2. 只保留 telemetry 端口
          - source_labels:
              - __meta_kubernetes_endpointslice_port_name
            action: keep
            regex: "telemetry"

          # 3. 添加 KSM Pod 名称
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: ksm_pod

      # ==========================================
      # 14. Pushgateway 监控
      # ==========================================
      - job_name: "pushgateway"

        # 保留 Pushgateway 提供的 job 和 instance 标签
        honor_labels: true

        # 本任务每 15 秒采集一次
        scrape_interval: 15s

        # Pushgateway 指标路径
        metrics_path: /metrics

        # 使用 Kubernetes EndpointSlice 服务发现
        kubernetes_sd_configs:
          - role: endpointslice

            # 只发现 pushgateway-ns 命名空间
            namespaces:
              names:
                - pushgateway-ns

        relabel_configs:
          # 1. 只保留 Pushgateway 对应的 Service
          - source_labels:
              - __meta_kubernetes_service_name
            action: keep
            regex: "pushgateway"

          # 2. 只保留 metrics 端口
          - source_labels:
              - __meta_kubernetes_endpointslice_port_name
            action: keep
            regex: "metrics"

          # 3. 添加 Pushgateway 所属命名空间
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: kubernetes_namespace
