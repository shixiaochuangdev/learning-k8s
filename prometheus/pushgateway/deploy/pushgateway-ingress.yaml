apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pushgateway-ingress
  namespace: pushgateway-ns
  labels:
    app: pushgateway

spec:
  # 指定 Nginx Ingress Controller
  ingressClassName: nginx

  rules:
    - host: pushgateway.shixiaochuang.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pushgateway
                port:
                  number: 9091