apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: mysql-monitor-ns

spec:
  type: ClusterIP

  selector:
    app: mysql

  ports:
    # MySQL 业务端口
    - name: mysql
      port: 3306
      targetPort: mysql

    # MySQL Exporter 监控端口
    - name: metrics
      port: 9104
      targetPort: metrics