apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: prometheus-ns

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

    scrape_configs:
      # Prometheus 自身监控
      - job_name: "prometheus"
        static_configs:
          - targets:
              - "localhost:9090"
            labels:
              app: "prometheus"

      # CoreDNS 监控
      - job_name: "coredns"
        static_configs:
          - targets:
              - "10.244.222.69:9153"
              - "10.244.222.68:9153"