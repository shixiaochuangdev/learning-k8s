apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis-ns

spec:
  type: ClusterIP

  selector:
    app: redis

  ports:
    # Redis 业务端口
    - name: redis
      port: 6379
      targetPort: redis

    # Redis Exporter 监控端口
    - name: metrics
      port: 9121
      targetPort: metrics