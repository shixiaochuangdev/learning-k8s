apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: redis-ns

type: Opaque

stringData:
  # 课堂实验密码
  redis-password: "123321"

  # Redis 配置文件
  redis.conf: |
    bind 0.0.0.0
    protected-mode yes

    port 6379

    daemonize no

    dir /data

    appendonly yes

    requirepass 123321