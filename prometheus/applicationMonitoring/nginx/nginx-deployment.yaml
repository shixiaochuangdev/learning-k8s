apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx-ns
  labels:
    app: nginx

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        # Nginx 业务容器
        - name: nginx
          image: shixiaochuangk8s/nginx:1.28.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

        # Nginx Prometheus Exporter
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.5.0
          imagePullPolicy: IfNotPresent

          args:
            - "--nginx.scrape-uri=http://127.0.0.1:80/stub_status"

          ports:
            - name: metrics
              containerPort: 9113

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config