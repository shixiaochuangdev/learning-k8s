apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: grafana-ns

data:
  prometheus.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus

        # 由 Grafana 服务端代理数据源请求
        access: proxy

        # Prometheus 集群内部访问地址
        url: http://prometheus.prometheus-ns.svc.cluster.local:9090

        # 设置为默认数据源
        isDefault: true

        # 允许在 Web UI 中编辑
        editable: true

        # 数据源配置版本
        version: 1