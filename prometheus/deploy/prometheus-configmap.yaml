apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: prometheus-ns
data:
  prometheus.yml: |
    # 全局配置
    global:
      # 指标采集周期
      scrape_interval: 15s

      # 告警规则及记录规则评估周期
      evaluation_interval: 15s

      # 单次指标采集超时时间
      scrape_timeout: 10s

    # 监控任务
    scrape_configs:
      # 监控 Prometheus 自身
      - job_name: "prometheus"
        static_configs:
          - targets:
              - "localhost:9090"
            labels:
              app: "prometheus"